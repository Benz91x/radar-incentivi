<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar Incentivi — Innovation &amp; Ventures</title>
<style>
:root{
  --green:#86BC25; --green-dark:#6b9a1c; --ink:#1a1a1a; --ink-2:#444; --ink-3:#777;
  --bg:#f4f5f2; --card:#ffffff; --line:#e3e5e0; --blue:#0076A8; --amber:#ED8B00;
  --red:#DA291C; --teal:#00A3A1; --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:var(--blue)}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1380px;margin:0 auto;padding:0 20px}

/* HEADER */
header{background:#000;color:#fff;position:sticky;top:0;z-index:50}
.hd{display:flex;align-items:center;gap:14px;padding:12px 0;flex-wrap:wrap}
.logo{display:flex;align-items:baseline;gap:8px;font-size:19px;font-weight:700;white-space:nowrap}
.logo .dot{color:var(--green);font-size:26px;line-height:0}
.logo small{font-weight:400;color:#bbb;font-size:12px}
.hd .sp{flex:1}
.hd .meta{font-size:11.5px;color:#aaa;text-align:right;line-height:1.5}
.hd .meta b{color:#ddd}
.btn{border:1px solid #555;background:#1c1c1c;color:#eee;border-radius:7px;padding:7px 13px;font-size:12.5px;transition:.15s}
.btn:hover{border-color:var(--green);color:var(--green)}
.btn.primary{background:var(--green);border-color:var(--green);color:#000;font-weight:600}
.btn.primary:hover{background:var(--green-dark);color:#fff}
.btn.light{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.light:hover{border-color:var(--green-dark);color:var(--green-dark)}
.btn.danger{color:#ff9b94;border-color:#7a342f}
nav.tabs{display:flex;gap:2px;border-top:1px solid #222}
nav.tabs button{background:none;border:none;color:#999;padding:11px 18px;font-size:13.5px;border-bottom:3px solid transparent}
nav.tabs button:hover{color:#fff}
nav.tabs button.on{color:#fff;border-bottom-color:var(--green);font-weight:600}
nav.tabs .cnt{background:#2c2c2c;border-radius:9px;padding:1px 8px;font-size:11px;margin-left:6px;color:#ccc}

/* SYNC STATUS */
.sync-bar{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#aaa;padding:4px 0 0}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#555;flex-shrink:0;transition:.3s}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:var(--red)}
.sync-dot.loading{background:var(--amber);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* LOADING OVERLAY */
.loading-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff}
.loading-overlay.hidden{display:none}
.loading-overlay .spin-big{width:48px;height:48px;border:4px solid rgba(255,255,255,.2);border-top-color:var(--green);border-radius:50%;animation:sp 1s linear infinite}
.loading-overlay p{font-size:15px;color:#eee}
.loading-overlay small{font-size:12px;color:#aaa}

/* EMPTY STATE */
.empty{max-width:680px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:38px;box-shadow:var(--shadow);text-align:center}
.empty h2{margin-bottom:8px}
.empty p{color:var(--ink-2);margin-bottom:18px}
.steps{text-align:left;margin:22px auto;max-width:520px;counter-reset:s}
.steps li{list-style:none;margin:13px 0;padding-left:44px;position:relative;color:var(--ink-2)}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--green);color:#000;font-weight:700;display:flex;align-items:center;justify-content:center}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;border-left:4px solid transparent}
.kpi:hover{transform:translateY(-2px)}
.kpi .v{font-size:25px;font-weight:700;letter-spacing:-.5px}
.kpi .l{font-size:11.5px;color:var(--ink-3);margin-top:2px;text-transform:uppercase;letter-spacing:.4px}
.kpi.gr{border-left-color:var(--green)} .kpi.gr .v{color:var(--green-dark)}
.kpi.bl{border-left-color:var(--blue)} .kpi.bl .v{color:var(--blue)}
.kpi.am{border-left-color:var(--amber)} .kpi.am .v{color:var(--amber)}
.kpi.rd{border-left-color:var(--red)} .kpi.rd .v{color:var(--red)}
.kpi.tl{border-left-color:var(--teal)} .kpi.tl .v{color:var(--teal)}

/* DASH PANELS */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;margin-bottom:24px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:16px 18px;box-shadow:var(--shadow)}
.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-2);margin-bottom:12px}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}
.bar .lab{width:150px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.bar .tr{flex:1;display:block;background:#eef0ea;border-radius:5px;height:16px;overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:5px;background:var(--green)}
.bar.b2 .fl{background:var(--blue)} .bar.b3 .fl{background:var(--teal)}
.bar .n{width:46px;text-align:right;font-weight:600;font-size:12px}

/* ── SOURCE SWITCHER (filtro padre) ── */
.source-switcher{
  display:flex;gap:8px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:11px;
  padding:12px 16px;margin:14px 0 0;box-shadow:var(--shadow);
  flex-wrap:wrap;
}
.source-switcher .src-label{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--ink-3);white-space:nowrap;margin-right:4px;
}
.src-btn{
  display:flex;align-items:center;gap:8px;
  border:2px solid var(--line);background:#fff;color:var(--ink-2);
  border-radius:9px;padding:9px 18px;font-size:13px;font-weight:600;
  transition:.15s;cursor:pointer;
}
.src-btn:hover{border-color:var(--ink-2);color:var(--ink)}
.src-btn .src-count{
  background:#f0f0f0;color:#888;
  border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;
  transition:.15s;
}
/* MIMIT attivo */
.src-btn.on-it{
  border-color:var(--green);background:#f0f7e6;color:var(--green-dark);
}
.src-btn.on-it .src-count{background:var(--green);color:#000;}
/* EU attivo */
.src-btn.on-eu{
  border-color:var(--blue);background:#e3f2fa;color:#004b8d;
}
.src-btn.on-eu .src-count{background:var(--blue);color:#fff;}
/* TUTTI attivo */
.src-btn.on-all{
  border-color:#555;background:#222;color:#fff;
}
.src-btn.on-all .src-count{background:#555;color:#fff;}

/* Banner fonte attiva */
.fonte-banner{
  display:flex;align-items:center;gap:10px;
  border-radius:9px;padding:8px 14px;margin:10px 0 0;
  font-size:12.5px;font-weight:600;
}
.fonte-banner.it{background:#f0f7e6;color:var(--green-dark);border:1px solid #c8e09a;}
.fonte-banner.eu{background:#e3f2fa;color:#004b8d;border:1px solid #9dcfed;}
.fonte-banner.all{background:#f5f5f5;color:var(--ink-2);border:1px solid var(--line);}

/* TOOLBAR / FILTERS */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 14px;margin:10px 0 14px;box-shadow:var(--shadow)}
.toolbar select,.toolbar input[type=search]{border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-size:12.5px;background:#fff;color:var(--ink)}
.toolbar input[type=search]{min-width:220px;flex:1}
.toolbar label{font-size:11px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
.chipline{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 0}
.fchip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 13px;font-size:12px;color:var(--ink-2)}
.fchip.on{background:#000;color:#fff;border-color:#000}
.fchip.on.t-in{background:var(--green-dark);border-color:var(--green-dark)}
.fchip.on.t-val{background:var(--amber);border-color:var(--amber)}
.fchip.on.t-out{background:var(--ink-3);border-color:var(--ink-3)}

/* CARDS */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(370px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;position:relative;transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 18px rgba(0,0,0,.1)}
.card.excluded{opacity:.62}
.card.is-eu{border-top:2px solid var(--blue)}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:5px;padding:3px 8px}
.b-attivo{background:#e8f4d8;color:var(--green-dark)}
.b-scad{background:#fdeede;color:var(--amber)}
.b-chiuso{background:#f1f1f1;color:#888}
.b-fut{background:#e2f0f7;color:var(--blue)}
.b-pnrr{background:#eae5f5;color:#6b46c1}
.b-ue{background:#e2f0f7;color:var(--blue)}
.b-naz{background:#fff5d6;color:#9a6c00}
.b-eu-portal{background:#cce4f4;color:#004b8d;font-size:10px}
.score{margin-left:auto;font-size:12px;font-weight:700;border-radius:14px;padding:3px 11px;cursor:help}
.s-in{background:var(--green);color:#000}
.s-val{background:var(--amber);color:#fff}
.s-out{background:#ddd;color:#666}
.card h4{font-size:15px;line-height:1.3}
.card h4 a{color:var(--ink);text-decoration:none}
.card h4 a:hover{color:var(--green-dark);text-decoration:underline}
.desc{color:var(--ink-2);font-size:12.8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nums{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.nums div{padding:8px 10px;background:#fafbf8}
.nums div+div{border-left:1px solid var(--line)}
.nums .nv{font-weight:700;font-size:14.5px}
.nums .nl{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px}
.meta-rows{font-size:12px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.meta-rows b{color:var(--ink)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:#eef3e3;color:var(--green-dark);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600}
.chip.alt{background:#f0f0f0;color:
