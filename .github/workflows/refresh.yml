name: Refresh Incentivi → Supabase

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh incentivi MIMIT via Supabase edge function
        run: |
          echo "Chiamata edge function refresh-incentivi..."
          response=$(curl -s -X POST \
            "https://ncfpbqoforedqwzgsqql.supabase.co/functions/v1/refresh-incentivi" \
            -H "Content-Type: application/json" \
            --max-time 120 \
            -w "\n__HTTP_STATUS__:%{http_code}")
          http_status=$(echo "$response" | grep "__HTTP_STATUS__" | cut -d: -f2)
          body=$(echo "$response" | grep -v "__HTTP_STATUS__")
          echo "HTTP status: $http_status"
          echo "Risposta: $body"
          if [ "$http_status" != "200" ]; then
            echo "ERRORE: HTTP $http_status"
            exit 1
          fi
          echo "$body" | grep -q '"ok":true' \
            && echo "✓ Refresh completato" \
            || echo "⚠ Controlla Supabase → Edge Functions → Logs"
