name: Refresh Incentivi Data

on:
  schedule:
    - cron: '0 3 * * *'   # ogni notte alle 03:00 UTC
  workflow_dispatch:        # eseguibile manualmente da Actions

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui refresh dati
        run: python refresh_dati.py

      - name: Commit aggiornamento dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add incentivi-data.js
          git diff --cached --quiet || git commit -m "chore: aggiorna incentivi-data.js [auto $(date -u +%Y-%m-%d)]"
          git push
