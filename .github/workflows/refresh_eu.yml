name: Refresh Call EU → Supabase

on:
  schedule:
    - cron: '30 3 * * *'   # ogni notte alle 03:30 UTC
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 25   # safety net: non deve girare oltre 25 min
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: pip install requests supabase

      - name: Scarica call aperte da EU Funding & Tenders Portal
        run: python fetch_eu_calls.py

      - name: Carica call EU su Supabase (tabella incentivi_eu)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INPUT_FILE: eu_calls_raw.json
        run: python upload_eu_to_supabase.py

      - name: Arricchisci descrizioni EU (topicDetails API)
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ENRICH_BATCH: '10'
        run: python enrich_eu_descriptions.py
