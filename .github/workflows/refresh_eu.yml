name: Refresh Call EU → Supabase

on:
  schedule:
    - cron: '30 3 * * *'   # ogni notte alle 03:30 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh call EU + enrichment via Supabase edge function
        run: |
          echo "Chiamata edge function refresh-eu-bulk..."
          response=$(curl -s -X POST \
            "https://ncfpbqoforedqwzgsqql.supabase.co/functions/v1/refresh-eu-bulk" \
            -H "Content-Type: application/json" \
            --max-time 30 \
            -w "\n__HTTP_STATUS__:%{http_code}")
          http_status=$(echo "$response" | grep "__HTTP_STATUS__" | cut -d: -f2)
          body=$(echo "$response" | grep -v "__HTTP_STATUS__")
          echo "HTTP status: $http_status"
          echo "Risposta: $body"
          if [ "$http_status" != "200" ]; then
            echo "ERRORE: HTTP $http_status"
            exit 1
          fi
          echo "✓ Pipeline EU avviata in background (download + upload + enrichment)"
